name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *' # Darroj ratri 12 vajta run honar
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via Curl
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
          
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'EOF'
          import os
          import requests

          base_url = os.environ.get('SUPABASE_URL', '').strip()
          key = os.environ.get('SUPABASE_KEY', '').strip()

          if not base_url or not key:
              print("Error: SUPABASE_URL or SUPABASE_KEY is missing in GitHub Secrets!")
              exit(1)

          # Ensure URL has proper scheme
          if not base_url.startswith("http://") and not base_url.startswith("https://"):
              base_url = "https://" + base_url

          clean_url = base_url.rstrip('/')
          target_url = f"{clean_url}/rest/v1/"

          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}'
          }

          print(f"Pinging Supabase endpoint: {target_url}")

          try:
              res = requests.get(target_url, headers=headers, timeout=15)
              print(f"Response Status Code: {res.status_code}")
              if res.status_code in [200, 401, 403]: # 401/403 means Supabase server is awake and responding
                  print("Success: Supabase project is active and alive!")
              else:
                  print(f"Server responded with code: {res.status_code}, message: {res.text}")
                  exit(1)
          except Exception as e:
              print(f"Connection error: {e}")
              exit(1)
          EOF
